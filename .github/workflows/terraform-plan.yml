# Runs `terraform plan` against the REAL project on PRs that touch infra/, so
# a reviewer sees what merging would actually change before approving.
#
# Authenticates as the read-only gha-plan service account via Workload
# Identity Federation (infra/wif.tf). There is no key in this repo or in
# GitHub secrets.
name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    # Dependabot PRs can't obtain OIDC tokens or read secrets, so the auth step
    # would just fail. CI still validates their Terraform.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # allow this job to request a GitHub OIDC token — the WIF "login"
      pull-requests: write # post the summary comment
    defaults:
      run:
        working-directory: infra
    env:
      # TF_VAR_<name> is how Terraform reads variables from the environment;
      # this replaces the terraform.tfvars file you use locally.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_domain: ${{ vars.APP_DOMAIN }}
      # A SECRET rather than a variable, purely so GitHub masks it as *** in
      # logs. This repo's Actions logs are public; your email needn't be.
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false # the wrapper garbles `terraform output -raw`

      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      - name: Plan
        run: |
          # Plan with the image tag that is deployed right now, so a PR that
          # doesn't touch the app doesn't show a spurious image change.
          TAG=$(terraform output -raw app_image_tag)
          # -lock=false: the read-only account can't write a lock file, and a
          # plan changes nothing, so it doesn't need one.
          terraform plan -input=false -lock=false -var "app_image_tag=$TAG" -out=tfplan

      # Comment with WHICH resources change, not their values. The full plan is
      # in this job's log (secrets masked). A PR comment on a public repo is not
      # masked, so attribute values — IPs, member emails — stay out of it.
      - name: Comment summary on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Terraform plan"
            echo
            terraform show -json tfplan | jq -r '
              [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] as $c
              | if ($c | length) == 0 then "No infrastructure changes."
                else ($c[] | "- `\(.change.actions | join("/"))` \(.address)") end'
            echo
            echo "Full plan: [job log]($RUN_URL). Merging applies this after approval of the \`production\` environment."
          } > comment.md
          # Update our previous comment if there is one, so re-pushes don't pile up.
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body-file comment.md ||
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
